  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --fondo: #F5F7FA; --blanco: #FFFFFF; --borde: #E2E7EE; --linea: #EEF1F5;
      --tinta: #0D1F3C; --texto: #44546A; --suave: #5B6B80;

    .ancho { max-width: 1200px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
    .etiqueta { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--etiqueta); }

    .logo { display: flex; align-items: center; gap: 10px; color: var(--tinta); }
    .logo b { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
    .logo b span { color: var(--acento); }
    .menu { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px; font-weight: 500; }
    .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; background: var(--tinta); color: #fff; font-weight: 600; font-size: 15px; }
    .boton:hover { color: #fff; background: #1B3358; }

    /* Portada */
    .hero { padding-top: 48px; padding-bottom: 28px; }
    .hero h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -.02em; }
    .hero h1 em { color: var(--acento); }

    /* Índice */
    /* Pestañas: una por app; solo se ve la tarjeta de la pestaña activa */
    .pestanas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .pestana { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-height: 44px; padding: 16px 18px; border-radius: 14px; cursor: pointer; font-family: inherit; background: var(--blanco); color: var(--tinta); border: 1px solid var(--borde); transition: border-color .2s; }
    .pestana:hover { border-color: var(--acento); }
    .pestana .num { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--etiqueta); }
    .pestana .nom { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
    .pestana .cat { font-size: 13px; color: var(--suave); }
    .pestana[aria-selected="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
    .pestana[aria-selected="true"] .num { color: #FF8A5C; }
    .pestana[aria-selected="true"] .cat { color: var(--claro-oscuro); }
    .app[hidden] { display: none; }

    /* Tarjeta de cada app */
    .apps { display: block; }
    .principal { padding-bottom: 48px; }
    .app { background: var(--blanco); border: 1px solid var(--borde); border-radius: 20px; overflow: hidden; }
    .intro { display: flex; flex-wrap: wrap; gap: 36px; align-items: center; padding: 36px 40px; }
    .intro-txt { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; }
    .intro h2 { margin-top: 12px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: 'Fraunces', serif; font-weight: 600; font-size: 36px; line-height: 1.05; letter-spacing: -.02em; }
    .tld { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--acento); background: var(--acento-suave); padding: 4px 10px; border-radius: 999px; }
    .desc { margin-top: 14px; font-size: 17px; line-height: 1.55; color: var(--texto); }
    .ideal { margin: 18px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips span { font-size: 14px; color: var(--tinta); background: var(--fondo); border: 1px solid var(--borde); padding: 6px 12px; border-radius: 999px; }
    .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 24px; }
    .acciones .boton { min-height: 48px; padding: 0 22px; }

    .intro-video { flex: 1 1 400px; min-width: 0; max-width: 500px; position: relative; }
    .intro-video::before { content: ''; display: block; padding-top: 56.25%; }  /* 16:9 que también funciona apilado en celular */
    .video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: var(--tinta); color: #fff; border: 0; padding: 0; cursor: pointer; font: inherit; }

    .video .mini img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.03); display: block; transition: opacity .2s; }
    .video:hover .mini img { opacity: .85; }
    .video .play { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(13,31,60,.35); }
    .video .pie { position: absolute; left: 20px; bottom: 18px; right: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; text-align: left; }

    .franja { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px; padding: 16px 40px; background: var(--fondo); border-top: 1px solid var(--borde); border-bottom: 1px solid var(--borde); }
    .franja-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--acento); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .franja-txt b { display: block; font-size: 16px; }
    .franja-txt span { display: block; margin-top: 2px; font-size: 14px; color: var(--suave); }
    .tiempo { font-size: 14px; font-weight: 600; background: var(--blanco); border: 1px solid var(--borde); padding: 8px 14px; border-radius: 999px; }

    /* Funcionalidades */
    .grupos { display: flex; flex-wrap: wrap; gap: 28px 48px; padding: 28px 40px; }
    .grupo { flex: 1 1 340px; min-width: 0; }
    .grupo.ancho2 { flex: 2 1 560px; }
    .grupo .etiqueta { font-size: 12px; margin-bottom: 6px; }
    .grupo h3 { margin-bottom: 10px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
    .grupo ol { list-style: none; padding: 0; display: grid; column-gap: 32px; grid-template-columns: minmax(0, 1fr); }
    .grupo.ancho2 ol { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .grupo li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--linea); }
    .grupo li i { width: 28px; height: 28px; border-radius: 50%; background: var(--acento-suave); color: var(--acento); font-style: normal; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .grupo li b { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; }
    .grupo li span { display: block; margin-top: 2px; font-size: 14px; line-height: 1.45; color: var(--suave); }

    /* Resultados */
    .resultados { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 0 40px 36px; }
    .resultado { display: flex; gap: 16px; align-items: center; padding: 16px 20px; border-radius: 14px; background: var(--tinta); color: #fff; }
    .resultado i { width: 40px; height: 40px; border-radius: 12px; background: var(--oscuro2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FF8A5C; }
    .resultado b { display: block; font-size: 16px; }
    .resultado span { display: block; margin-top: 2px; font-size: 14px; color: var(--claro-oscuro); }

    @media (max-width: 767px) {
      .ancho { padding-left: 16px; padding-right: 16px; }
      .menu { gap: 16px; }
      .hero { padding-top: 28px; padding-bottom: 20px; }
      .grupo, .grupo.ancho2 { flex-basis: 100%; }
      .intro-txt, .intro-video { flex: none; }
      .video .play { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
      .video .pie { left: 12px; right: 12px; bottom: 10px; font-size: 12.5px; }
      .pestanas { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
      .pestana { padding: 12px; border-radius: 12px; }
      .pestana .nom { font-size: 16px; }
      .pestana .cat { font-size: 12px; }
      .app { border-radius: 18px; }
      .principal { padding-bottom: 28px; }
      .intro { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 24px; padding: 24px 20px; }
      .intro-video { max-width: none; }
      .intro h2 { font-size: 30px; }
      .desc { font-size: 16px; }
      .franja { padding: 14px 20px; }
      .grupos { gap: 24px; padding: 22px 20px 24px; }
      .grupo.ancho2 ol { grid-template-columns: minmax(0, 1fr); }
      .resultados { grid-template-columns: minmax(0, 1fr); padding: 0 20px 24px; }
    }
  </style>
</head>

  const ICO = {
    flecha: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>',
    youtube: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
    check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4.5 4.5L19 7"/></svg>',
    play: '<svg width="26" height="26" viewBox="0 0 24 24" fill="#0D1F3C" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
    grafico: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>',
  }

  function registrarContacto() {
    try { fbq('track', 'Contact', { content_name: 'WhatsApp', content_category: 'catalogo-soluciones' }) } catch (e) {}
    try { gtag('event', 'conversion', { send_to: 'AW-18223884875/7ttCCMPd79QcEMvU6fFD', value: 50.0, currency: 'PEN' }) } catch (e) {}
  }

  const pestanas = document.getElementById('pestanas'), contenedor = document.getElementById('apps')
  APPS.forEach((app, i) => {
    const num = String(i + 1).padStart(2, '0')
    pestanas.insertAdjacentHTML('beforeend', `<button type="button" class="pestana" role="tab" id="tab-${app.id}" aria-controls="${app.id}" aria-selected="false" data-app="${app.id}"><span class="num">${num}</span><span class="nom">${app.nombre}</span><span class="cat">${app.categoria}</span></button>`)
    const [cTit, cSub, cTiempo] = app.inicioCuenta
    const art = document.createElement('article')
    art.className = 'app'; art.id = app.id
    art.setAttribute('role', 'tabpanel'); art.setAttribute('aria-labelledby', 'tab-' + app.id)
    art.innerHTML = `
      <div class="intro">
        <div class="intro-txt">
          <p class="etiqueta">${num} · ${app.categoria}</p>
          <h2>${app.nombre}<span class="tld">${app.tld}</span></h2>
          <p class="desc">${app.desc}</p>
          <p class="ideal">Ideal para</p>
          <div class="chips">${app.para.map(p => `<span>${p}</span>`).join('')}</div>
          <div class="acciones">
            <a class="boton" href="https://${app.dominio}" target="_blank" rel="noopener">Visitar ${app.dominio} ${ICO.flecha}</a>
            <a class="sec" href="https://www.youtube.com/playlist?list=${app.lista}" target="_blank" rel="noopener">${ICO.youtube}Ver tutoriales</a>
          </div>
        </div>
        <div class="intro-video">
          <button class="video" type="button" aria-label="Ver los videos de ${app.nombre}">
            <span class="mini"><img src="https://i.ytimg.com/vi/${app.portada}/maxresdefault.jpg" alt="" loading="lazy"></span>
            <span class="play">${ICO.play}</span>
            <span class="pie"><span>Mira cómo funciona ${app.nombre}</span><span class="demo">Demo</span></span>
          </button>
        </div>
      </div>
      <div class="franja">
        <span class="franja-ic">${ICO.check}</span>
        <div class="franja-txt"><b>${cTit}</b><span>${cSub}</span></div>
        <span class="tiempo">⏱ ${cTiempo}</span>
      </div>
      <div class="grupos">${app.grupos.map(g => `
        <section class="grupo${g.ancho ? ' ancho2' : ''}">
          <p class="etiqueta">${g.eti}</p>
          <h3>${g.tit}</h3>
          <ol>${g.pasos.map((p, k) => `<li><i>${k + 1}</i><div><b>${p.t}</b><span>${p.d}</span></div></li>`).join('')}</ol>
        </section>`).join('')}
      </div>
      <div class="resultados">${app.resultados.map(r => `
        <div class="resultado"><i>${ICO.grafico}</i><div><b>${r.t}</b><span>${r.d}</span></div></div>`).join('')}
      </div>`
    const miniatura = art.querySelector('.video').outerHTML
    // Al hacer clic la miniatura se cambia por el reproductor; al cambiar de pestaña vuelve la miniatura
    // (así el video de una pestaña oculta deja de sonar).
    art.querySelector('.intro-video').addEventListener('click', e => {
      const boton = e.target.closest('button.video'); if (!boton) return
      const marco = document.createElement('div')
      marco.className = 'video'
      marco.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${app.inicio}?list=${app.lista}&autoplay=1&rel=0" title="Videos de ${app.nombre}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
      boton.replaceWith(marco)
    })
    art.restaurarMiniatura = () => { const v = art.querySelector('div.video'); if (v) v.outerHTML = miniatura }
    contenedor.appendChild(art)
  })

  // Pestañas: muestra solo la app elegida. Respeta los enlaces con #id (p. ej. /soluciones#renta-corta).
  function mostrar(id, enfocar) {
    const app = APPS.find(a => a.id === id) || APPS[0]
    document.querySelectorAll('.pestana').forEach(t => t.setAttribute('aria-selected', String(t.dataset.app === app.id)))
    document.querySelectorAll('.app').forEach(a => { if (a.id !== app.id) { a.hidden = true; a.restaurarMiniatura() } else a.hidden = false })
    if (enfocar) document.getElementById('soluciones').scrollIntoView({ behavior: 'smooth', block: 'start' })
  }
  pestanas.addEventListener('click', e => {
    const t = e.target.closest('.pestana'); if (!t) return
    mostrar(t.dataset.app)
    history.replaceState(null, '', '#' + t.dataset.app)
  })
  pestanas.addEventListener('keydown', e => {
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return
    const ts = [...pestanas.querySelectorAll('.pestana')], i = ts.findIndex(t => t.getAttribute('aria-selected') === 'true')
    const sig = ts[(i + (e.key === 'ArrowRight' ? 1 : ts.length - 1)) % ts.length]
    sig.focus(); sig.click()
  })
  const desdeHash = () => { const id = location.hash.slice(1); if (APPS.some(a => a.id === id)) { mostrar(id, true); return true } return false }
  if (!desdeHash()) mostrar(APPS[0].id)
  window.addEventListener('hashchange', desdeHash)

  // Botón «Pide una demo gratis» de la cabecera (WhatsApp).
  document.querySelectorAll('.wa-contacto').forEach(a => {
    a.href = 'https://wa.me/51925079592?text=' + encodeURIComponent(a.dataset.mensaje)
    a.addEventListener('click', registrarContacto)
  })
</script>
</body>
</html>
