  <style>

    .pestana { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-height: 44px; padding: 16px 18px; border-radius: 14px; cursor: pointer; font-family: inherit; background: var(--blanco); color: var(--tinta); border: 1px solid var(--borde); transition: border-color .2s; }

      .pestanas { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
      .pestana { align-items: center; justify-content: center; text-align: center; gap: 3px; min-height: 58px; padding: 8px 2px; border-radius: 10px; }
      .pestana .num { font-size: 11px; letter-spacing: .04em; }

      .desc { font-size: 16px; }

  function diagrama(app) {
    const d = PROCESOS[app.id]
    if (!d) return `<div class="proceso-img"><a href="img/procesos/renta-corta.webp?v=1" target="_blank" rel="noopener" title="Haz clic para verla en grande"><img src="img/procesos/renta-corta.webp?v=1" width="1600" height="1203" loading="lazy" alt="Cómo funciona ${app.nombre}: Airbnb avisa cada reserva, el huésped registra a sus acompañantes, el conserje marca la llegada, limpieza confirma con fotos y el anfitrión recibe reportes y alertas."></a></div>`
    const DY = 78   // se quita la franja roja de arriba: el título queda a 20 px del borde
    const pos = c => `left:${c.x}px;top:${c.y - DY}px;width:${c.w}px;${c.h ? `height:${c.h}px;` : ''}`
    const alto = d.alto - DY
    return `<div class="diag-marco" title="Haz clic para verlo en grande"><div class="diag" style="height:${alto}px" data-alto="${alto}">
      <svg viewBox="0 ${DY} 1120 ${alto}" width="1120" height="${alto}" aria-hidden="true">${d.casa}</svg>
      <svg viewBox="0 ${DY} 1120 ${alto}" width="1120" height="${alto}" aria-hidden="true">${d.lineas}</svg>
      <div class="d-titulo" style="${pos(d.titulo)}">${d.titulo.html}</div>
      <div class="d-frase" style="${pos(d.frase)}">${d.frase.html}</div>
      <div class="d-centro" style="${pos(d.centro)}">${d.centro.html}</div>
      ${d.tarjetas.map(t => `<div class="d-tarjeta" style="${pos(t)}--c:${t.color}"><svg viewBox="0 0 44 44" aria-hidden="true">${t.icono || ''}</svg>${t.html}</div>`).join('')}
      ${d.numeros.map(n => `<div class="d-num" style="${pos(n)}background:${n.color}" aria-hidden="true">${n.n}</div>`).join('')}
      <div class="d-leyenda" style="${pos({ ...d.leyenda, h: 0 })}min-height:${d.leyenda.h}px;grid-template-rows:repeat(${d.leyenda.filas},auto)">${d.leyenda.html}</div>
    </div></div>`
  }

  // Escala el lienzo de 1120 px al ancho disponible (en celular el diagrama se apila y no se escala).
  const movil = matchMedia('(max-width: 767px)')
  function ajustarDiagramas() {
    document.querySelectorAll('.app:not([hidden]) .diag').forEach(dg => {
      const marco = dg.parentElement
      // Si un texto de la leyenda ocupa dos líneas, el lienzo crece para que no se corte.
      const ley = dg.querySelector('.d-leyenda')
      const alto = Math.max(+dg.dataset.alto, ley.offsetTop + ley.offsetHeight + 20)
      dg.style.height = alto + 'px'
      const k = Math.min(1, marco.clientWidth / 1120)
      dg.style.transform = k < 1 ? `scale(${k})` : ''
      marco.style.height = (alto * k) + 'px'
    })
  }
  addEventListener('resize', ajustarDiagramas)
  document.addEventListener('click', e => {
    const marco = e.target.closest('.diag-marco')
    if (!marco) return
    const capa = document.createElement('div')
    capa.className = 'diag-zoom'
    capa.setAttribute('role', 'dialog'); capa.setAttribute('aria-label', 'Diagrama en grande')
    const copia = marco.querySelector('.diag').cloneNode(true)
    copia.style.transform = ''
    capa.innerHTML = '<button type="button">Cerrar ✕</button>'
    if (!movil.matches) copia.style.margin = '56px auto 32px'
    capa.appendChild(copia)
    const tecla = ev => { if (ev.key === 'Escape') cerrar() }
    const cerrar = () => { capa.remove(); document.body.style.overflow = ''; removeEventListener('keydown', tecla) }
    capa.querySelector('button').addEventListener('click', cerrar)
    addEventListener('keydown', tecla)
    document.body.style.overflow = 'hidden'
    document.body.appendChild(capa)
    capa.scrollLeft = (copia.offsetWidth - capa.clientWidth) / 2
  })

            <a class="icono app-wa" href="https://wa.me/51925079592?text=${encodeURIComponent(`Hola Pragma TI, quiero información sobre ${app.nombre}.`)}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp sobre ${app.nombre}" title="WhatsApp +51 925 079 592">${ICO.whatsapp}</a>
          </div>
        </div>
        <section class="intro-diag" aria-label="Cómo funciona ${app.nombre}">${diagrama(app)}</section>
      </div>`

    contenedor.appendChild(art)
  })

  // Pestañas: muestra solo la app elegida. Respeta los enlaces con #id (p. ej. /soluciones#renta-corta).
  function mostrar(id, enfocar) {
    const app = APPS.find(a => a.id === id) || APPS[0]
    document.querySelectorAll('.pestana').forEach(t => t.setAttribute('aria-selected', String(t.dataset.app === app.id)))
    document.querySelectorAll('.app').forEach(a => { a.hidden = a.id !== app.id })
    ajustarDiagramas()
    if (enfocar) document.getElementById('soluciones').scrollIntoView({ behavior: 'smooth', block: 'start' })
  }
  pestanas.addEventListener('click', e => {
    const t = e.target.closest('.pestana'); if (!t) return
    mostrar(t.dataset.app)
    history.replaceState(null, '', '#' + t.dataset.app)
  })
  pestanas.addEventListener('keydown', e => {
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return
    const ts = [...pestanas.querySelectorAll('.pestana')], i = ts.findIndex(t => t.getAttribute('aria-selected') === 'true')
    const sig = ts[(i + (e.key === 'ArrowRight' ? 1 : ts.length - 1)) % ts.length]
    sig.focus(); sig.click()
  })
  const desdeHash = () => { const id = location.hash.slice(1); if (APPS.some(a => a.id === id)) { mostrar(id, true); return true } return false }
  if (!desdeHash()) mostrar(APPS[0].id)
  window.addEventListener('hashchange', desdeHash)

  // Botón «Pide una demo gratis» de la cabecera (WhatsApp).
  document.querySelectorAll('.wa-contacto').forEach(a => {
    a.href = 'https://wa.me/51925079592?text=' + encodeURIComponent(a.dataset.mensaje)
    a.addEventListener('click', registrarContacto)
  })
