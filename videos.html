  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --fondo: #F5F7FA; --blanco: #FFFFFF; --borde: #E2E7EE; --linea: #EEF1F5;
      --tinta: #0D1F3C; --texto: #44546A; --suave: #5B6B80;
      --acento: #1A5BA8; --acento-suave: #EAF1FA; --etiqueta: #B4410F; --naranja: #FF6B35;
      --oscuro2: #1B3358; --claro-oscuro: #B9C6D8;
    }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; }
    body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--acento); text-decoration: none; }
    a:hover { color: var(--tinta); }
    h1, h2, h3, p, ol { margin: 0; }
    .serif { font-family: 'Fraunces', serif; }
    .ancho { max-width: 1200px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
    .etiqueta { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--etiqueta); }

    /* Cabecera */
    .cab { background: var(--blanco); border-bottom: 1px solid var(--borde); }
    .cab-in { padding-top: 18px; padding-bottom: 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; color: var(--tinta); }
    .logo b { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
    .logo b span { color: var(--acento); }
    .menu { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px; font-weight: 500; }
    .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; background: var(--tinta); color: #fff; font-weight: 600; font-size: 15px; }
    .boton:hover { color: #fff; background: #1B3358; }
    .boton.claro { background: var(--blanco); color: var(--tinta); border: 1px solid var(--borde); }
    .boton.claro:hover { background: var(--acento-suave); color: var(--tinta); border-color: var(--acento); }

    /* Portada */
    .hero { padding-top: 48px; padding-bottom: 28px; }
    .hero h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -.02em; }
    .hero h1 em { color: var(--acento); }

    .hero p { margin-top: 10px; font-size: 17px; color: var(--suave); }

    /* Las 5 soluciones: una tarjeta por app con su video vertical */
    .principal { max-width: 1360px; padding-bottom: 56px; }
    .apps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
    /* subgrid: etiqueta, título, video e íconos quedan a la misma altura en las 5 tarjetas */
    .app { grid-row: span 4; display: grid; grid-template-rows: subgrid; row-gap: 0; align-content: start; scroll-margin-top: 16px; background: var(--blanco); border: 1px solid var(--borde); border-radius: 20px; padding: 16px 14px 18px; }
    .app .etiqueta { font-size: 11.5px; letter-spacing: .1em; align-self: end; }
    .app h2 { margin: 6px 0 12px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 23px; line-height: 1.1; letter-spacing: -.02em; align-self: end; }
    .tld { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--acento); background: var(--acento-suave); padding: 3px 8px; border-radius: 999px; }

    /* Video vertical. Las miniaturas de YouTube son 16:9 con el video vertical al centro: se recorta. */
    .video { position: relative; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: var(--tinta); }
    .video iframe, .v-play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .v-play { padding: 0; background: var(--tinta); cursor: pointer; }
    .v-play img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); display: block; transition: transform .3s; }
    .v-play:hover img { transform: scale(1.08); }
    .v-play .play { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(13,31,60,.35); }
    .v-ampliar { position: absolute; top: 8px; right: 8px; z-index: 2; width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(13,31,60,.72); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .v-ampliar:hover { background: var(--tinta); }

    /* Descripción (oculta hasta tocar el ícono de información): se abre sobre el video */
    .info { position: absolute; inset: 0; z-index: 3; overflow: auto; padding: 18px 16px; background: rgba(255,255,255,.97); color: var(--texto); }
    .info[hidden] { display: none; }
    .info .desc { font-size: 14px; line-height: 1.45; }
    .info .ideal { margin: 14px 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips span { font-size: 12.5px; color: var(--tinta); background: var(--fondo); border: 1px solid var(--borde); padding: 4px 10px; border-radius: 999px; }

    .acciones { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
    .icono { width: 46px; height: 46px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--borde); background: var(--blanco); color: var(--tinta); cursor: pointer; transition: border-color .2s, transform .2s, background .2s; }
    .icono:hover { border-color: var(--acento); transform: translateY(-2px); color: var(--tinta); }
    .icono[aria-expanded="true"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    .acciones svg { flex-shrink: 0; }

    /* Video a tamaño real */
    .video-zoom { position: fixed; inset: 0; z-index: 1000; background: rgba(13,31,60,.94); display: flex; align-items: center; justify-content: center; padding: 64px 16px 24px; }
    .video-zoom iframe { width: min(92vw, calc((100vh - 96px) * 9 / 16)); aspect-ratio: 9 / 16; height: auto; border: 0; border-radius: 14px; background: #000; }
    .video-zoom button { position: fixed; top: 12px; right: 12px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #fff; color: var(--tinta); font: 600 15px 'DM Sans', sans-serif; cursor: pointer; }

    .deslizar { display: none; }

    /* Tableta: 3 por fila */
    @media (max-width: 1099px) { .apps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 359px) { .logo b { display: none; } }  /* en pantallas muy angostas queda solo el isotipo */
    /* Celular: las tarjetas se deslizan de lado, como historias */
    @media (max-width: 767px) {
      .ancho { padding-left: 16px; padding-right: 16px; }
      .menu { gap: 8px; }
      .menu .boton { padding: 0 12px; font-size: 13.5px; }
      .cab-in { gap: 10px; }
      .txt-largo { display: none; }
      .hero { padding-top: 28px; padding-bottom: 18px; }
      .hero p { font-size: 15.5px; }
      .principal { padding-left: 0; padding-right: 0; padding-bottom: 32px; }
      .apps { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 16px 10px; scroll-padding: 0 16px; scrollbar-width: none; }
      .apps::-webkit-scrollbar { display: none; }
      .app { flex: 0 0 74%; scroll-snap-align: center; display: flex; flex-direction: column; }
      .app .etiqueta, .app h2 { align-self: auto; }
      .deslizar { display: block; margin-top: 8px; text-align: center; font-size: 13.5px; color: var(--suave); }
    }
  </style>
</head>

<script>
  // Cada solución: textos del rediseño aprobado (catalogo/soluciones-rediseno.html) y los enlaces reales.
  // lista = lista de YouTube; inicio = primer video (el reproductor se abre en él y sigue con la lista;
  // la forma «videoseries» fallaba al azar con «Video no disponible»); portada = video de la miniatura.
  const APPS = [
    { id: 'asistenzia', nombre: 'Asistenzia', corto: 'Asis­tenzia', tld: '.app', dominio: 'asistenzia.app', categoria: 'Asistencia y visitas',
      lista: 'PLNiqJejKUFGY', inicio: 'lynC4b8buSo', portada: 'cSY4n4giEVA',
      desc: 'Aplicación web para controlar la asistencia del personal y registrar el ingreso y salida de visitas, con foto, hora y ubicación.',
      para: ['Empresas y pymes', 'Obras y proyectos', 'Clínicas y colegios', 'Edificios y recepciones'], },
    { id: 'azamblea', nombre: 'Azamblea', corto: 'Azam­blea', tld: '.app', dominio: 'azamblea.app', categoria: 'Asambleas',
      lista: 'PLamHDec3hxIA', inicio: 'X5WpRR3V0wE', portada: 'EAMdZabqUGQ',
      desc: 'Aplicación web para gestionar reuniones de forma dinámica: convocatoria, quórum en vivo, votaciones en tiempo real y resultados publicados en acta.',
      para: ['Asociaciones y juntas vecinales', 'Cooperativas', 'Clubes, gremios y sindicatos', 'Directorios y juntas de accionistas'], },
    { id: 'junta-de-propietarios', nombre: 'Junta de Propietarios', corto: 'Junta', tld: '.org', dominio: 'juntadepropietarios.org', categoria: 'Administración de edificios',
      lista: 'PLA1uFvDQmyz8', inicio: 'rkkBbvxZI84', portada: 'rkkBbvxZI84',
      desc: 'Aplicación web de administración y mantenimiento para edificios residenciales: padrón, reuniones y votaciones, presupuesto, cuotas y recibos, todo en un solo lugar.',
      para: ['Edificios y condominios', 'Administradores', 'Junta directiva', 'Propietarios'], },
    { id: 'limpiadores', nombre: 'Limpiadores', corto: 'Limpia­dores', tld: '.app', dominio: 'limpiadores.app', categoria: 'Limpieza con evidencia',
      lista: 'PLNKK3srRKwV8', inicio: 'm8PMjO1KbRA', portada: 'm8PMjO1KbRA',
      desc: 'Aplicación web para programar cada servicio de limpieza y ejecutarlo con evidencia: fotos de antes y después, acta del servicio y reportes históricos.',
      para: ['Edificios', 'Propiedades particulares', 'Alquileres', 'Personal de limpieza independiente'], },
    { id: 'renta-corta', nombre: 'Renta Corta', tld: '.app', dominio: 'rentacorta.app', categoria: 'Huéspedes Airbnb',
      lista: 'PLK-3aSlpwZns', inicio: 'hmUYkZTktDE', portada: 'hmUYkZTktDE',
      desc: 'Aplicación web para rentas cortas en piloto automático: sincronización con Airbnb, registro de huéspedes, limpiezas programadas y avisos por WhatsApp.',
      para: ['Anfitriones', 'Propietarios de departamentos en alquiler temporal'], },
  ]

  const ICO = {
    web: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>',
    whatsapp: '<svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path fill="#25D366" d="M16 3C9.4 3 4 8.4 4 15c0 2.1.6 4.1 1.6 5.9L4 29l8.3-1.6c1.7.9 3.6 1.4 5.7 1.4 6.6 0 12-5.4 12-12S22.6 3 16 3z"/><path fill="#fff" d="M12.6 9.6c-.3-.6-.6-.6-.9-.6h-.8c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.2 2.6 4.1 6.4 5.6 3.2 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.2-.3-.3-.7-.5l-2.4-1.2c-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7l-1.2-2.8z"/></svg>',
    info: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>',
    play: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#0D1F3C" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
    ampliar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
  }

  function registrarContacto() {
    try { fbq('track', 'Contact', { content_name: 'WhatsApp', content_category: 'catalogo-soluciones' }) } catch (e) {}
    try { gtag('event', 'conversion', { send_to: 'AW-18223884875/7ttCCMPd79QcEMvU6fFD', value: 50.0, currency: 'PEN' }) } catch (e) {}
  }

  const contenedor = document.getElementById('apps')
  const restaurarTodos = salvo => document.querySelectorAll('.app').forEach(a => { if (a !== salvo) a.restaurarVideo() })
  APPS.forEach((app, i) => {
    const num = String(i + 1).padStart(2, '0')
    const art = document.createElement('article')
    art.className = 'app'; art.id = app.id
    art.innerHTML = `
      <p class="etiqueta">${num} · ${app.categoria}</p>
      <h2>${app.nombre}</h2>
      <div class="video">
        <button class="v-play" type="button" aria-label="Reproducir el video de ${app.nombre}">
          <img src="https://i.ytimg.com/vi/${app.portada}/maxresdefault.jpg" alt="" loading="lazy">
          <span class="play">${ICO.play}</span>
        </button>
        <button class="v-ampliar" type="button" aria-label="Ver el video de ${app.nombre} en tamaño real" title="Ver en tamaño real">${ICO.ampliar}</button>
        <div class="info" id="info-${app.id}" hidden>
          <p class="desc">${app.desc}</p>
          <p class="ideal">Ideal para</p>
          <div class="chips">${app.para.map(p => `<span>${p}</span>`).join('')}</div>
        </div>
      </div>
      <div class="acciones">
        <a class="icono" href="https://${app.dominio}" target="_blank" rel="noopener" aria-label="Visitar ${app.dominio}" title="${app.dominio}">${ICO.web}</a>
        <a class="icono app-wa" href="https://wa.me/51925079592?text=${encodeURIComponent(`Hola Pragma TI, quiero información sobre ${app.nombre}.`)}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp sobre ${app.nombre}" title="WhatsApp +51 925 079 592">${ICO.whatsapp}</a>
        <button class="icono v-info" type="button" aria-expanded="false" aria-controls="info-${app.id}" aria-label="Qué hace ${app.nombre}" title="Qué hace">${ICO.info}</button>
      </div>`
    art.querySelector('.app-wa').addEventListener('click', registrarContacto)

    // Video: se reproduce en su recuadro (solo uno a la vez) o se abre en tamaño real.
    const urlVideo = `https://www.youtube-nocookie.com/embed/${app.inicio}?list=${app.lista}&autoplay=1&rel=0&playsinline=1`
    const marco = art.querySelector('.video'), miniatura = marco.querySelector('.v-play').outerHTML
    const iframe = titulo => `<iframe src="${urlVideo}" title="${titulo}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
    const info = art.querySelector('.info'), botonInfo = art.querySelector('.v-info')
    const mostrarInfo = si => { info.hidden = !si; botonInfo.setAttribute('aria-expanded', si) }
    art.restaurarVideo = () => { const f = marco.querySelector('iframe'); if (f) f.outerHTML = miniatura }
    botonInfo.addEventListener('click', () => mostrarInfo(info.hidden))
    info.addEventListener('click', () => mostrarInfo(false))
    marco.addEventListener('click', e => {
      if (e.target.closest('.v-play')) { restaurarTodos(art); e.target.closest('.v-play').outerHTML = iframe(`Videos de ${app.nombre}`); return }
      if (!e.target.closest('.v-ampliar')) return
      restaurarTodos(null)
      const capa = document.createElement('div')
      capa.className = 'video-zoom'
      capa.setAttribute('role', 'dialog'); capa.setAttribute('aria-label', `Video de ${app.nombre}`)
      capa.innerHTML = `<button type="button">Cerrar ✕</button>${iframe(`Videos de ${app.nombre} en tamaño real`)}`
      const tecla = ev => { if (ev.key === 'Escape') cerrar() }
      const cerrar = () => { capa.remove(); document.body.style.overflow = ''; removeEventListener('keydown', tecla) }
      capa.querySelector('button').addEventListener('click', cerrar)
      capa.addEventListener('click', ev => { if (ev.target === capa) cerrar() })
      addEventListener('keydown', tecla)
      document.body.style.overflow = 'hidden'
      document.body.appendChild(capa)
    })
    contenedor.appendChild(art)
  })

  // Si se entra con #app (p. ej. /soluciones#renta-corta), lleva a esa tarjeta.
  const id0 = location.hash.slice(1)
  if (APPS.some(a => a.id === id0)) requestAnimationFrame(() => document.getElementById(id0).scrollIntoView({ block: 'start', inline: 'center' }))

  // Botón «Pide una demo gratis» de la cabecera (WhatsApp).
  document.querySelectorAll('.wa-contacto').forEach(a => {
    a.href = 'https://wa.me/51925079592?text=' + encodeURIComponent(a.dataset.mensaje)
    a.addEventListener('click', registrarContacto)
  })
</script>
